name: "Automated Security & Vulnerability Scan"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    name: Bandit SAST & Pip Audit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Bandit Code Vulnerability Scan
      run: |
        bandit -r . -ll -ii --exclude ./venv

    - name: Run Pip Audit Dependency Vulnerability Scan
      run: |
        pip-audit -r requirements.txt
