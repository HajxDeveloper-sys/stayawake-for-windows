[ui]
# Show the "Reset Timer / Süreyi Sıfırla" button in GUI (true / false)
show_reset_button = true

# Default interface language ("TR" or "EN")
default_language = "TR"

# Window resizability (true / false)
allow_resizable = true

[protection]
# Default checkbox states on startup
default_keep_display = true
default_keep_system = true
default_virtual_heartbeat = false

[security]
# Enable Anti-DDoS rate limiting protection against event spamming & flood attacks
rate_limit_enabled = true

# Maximum token burst capacity for rapid UI actions
max_burst_capacity = 10

# Token refill rate per second
refill_rate_per_sec = 2.0

# Keep one app window in charge of power protection at a time
single_instance_only = true
